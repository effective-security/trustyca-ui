<div class="login-page">
  <section class="login-panel">
    <header><app-brand /></header>
    <main class="login-content"><ng-content /></main>
    <footer><span>Trusty CA</span><span>Certificate lifecycle, simplified.</span></footer>
  </section>

  <aside class="visual-panel" aria-label="An illustration of a certificate chain of trust">
    <div class="visual-grid"></div>
    <div class="visual-topline">
      <span class="visual-label">Built on trust.</span
      ><span class="visual-edition">Console / 01</span>
    </div>
    <div class="trust-illustration" aria-hidden="true">
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>
      <div class="root-node">
        <img src="brand/trusty-mark.svg" alt="" /><span>TRUSTY CA</span
        ><small>The root of your trust</small>
      </div>
      <svg class="chain-lines" viewBox="0 0 480 330" fill="none">
        <path d="M240 135v45H120v50 M240 180h120v50" stroke="#8bbca3" stroke-width="1.2" />
        <circle cx="240" cy="180" r="4" fill="#a7d0a7" />
      </svg>
      <div class="chain-node issuer-node">
        <app-icon name="layers" /><span>Issuers</span><span class="node-dot"></span>
      </div>
      <div class="chain-node certificate-node">
        <app-icon name="certificate" /><span>Certificates</span><span class="node-dot"></span>
      </div>
      <div class="floating-label">
        <span class="status-dot"></span> One connected chain of trust
      </div>
    </div>
    <div class="visual-caption">
      <span class="caption-rule"></span>
      <p>Confidence in every<br /><strong>certificate.</strong></p>
      <small>A clear view of your public key infrastructure.</small>
    </div>
    <span class="visual-bottom">ROOTED IN SECURITY. DESIGNED FOR CLARITY.</span>
  </aside>
</div>
